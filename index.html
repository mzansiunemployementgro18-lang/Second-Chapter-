<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Second Chapter - Love After Kids</title>
<style>
body{margin:0;font-family:Arial;background:#fff0f3;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:white;width:90%;max-width:380px;border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,0.15);text-align:center}
h1{color:#e11d48;margin:0}
p{color:#666}
.scratch-box{position:relative;width:100%;height:180px;background:#eee;border-radius:15px;margin:20px 0;overflow:hidden;cursor:pointer;border:2px dashed #e11d48}
#prize{position:absolute;width:100%;height:100%;display:flex;justify-content:center;align-items:center;font-size:22px;font-weight:bold;color:#e11d48;background:#fff9fb}
#cover{position:absolute;width:100%;height:100%;background:#e11d48;display:flex;justify-content:center;align-items:center;color:white;font-size:18px;transition:0.3s}
.btn{background:#e11d48;color:white;border:none;padding:12px 20px;border-radius:25px;width:100%;font-size:16px;font-weight:bold;cursor:pointer}
.small{font-size:12px;color:#999;margin-top:10px}
</style>
</head>
<body>
<div class="card">
<h1>Second Chapter 💕</h1>
<p>For single moms & dads finding love again</p>

<div class="scratch-box" id="scratchBox">
<div id="prize">🎁 Loading...</div>
<div id="cover">👆 TAP TO SCRATCH</div>
</div>

<button class="btn" onclick="resetScratch()">Scratch Again (Demo)</button>
<p class="small">Win: Bracelets, Watches, Dinner for 2, Engagement Ring 💍<br>Earn free scratch cards by chatting 7 days</p>
<button class="btn" style="background:#111;margin-top:10px" onclick="alert('Next: Connect this to Firebase to give real users scratch cards')">Join Second Chapter</button>
</div>

<script>
const prizes = [
"💍 ENGAGEMENT RING - Legendary!",
"⌚ WATCH - Rare Win!",
"🍽️ Dinner for 2 at Clicks",
"💎 Bracelet - You Won!",
"🎉 R50 Boxer Voucher",
"💔 Try Again - More Love Tomorrow"
];
const prizeEl = document.getElementById('prize');
const coverEl = document.getElementById('cover');

function setPrize(){
  const rand = Math.random()*100;
  let p;
  if(rand < 0.5) p = prizes[0];
  else if(rand < 5) p = prizes[1];
  else if(rand < 20) p = prizes[2];
  else if(rand < 60) p = prizes[3];
  else if(rand < 85) p = prizes[4];
  else p = prizes[5];
  prizeEl.innerHTML = p;
}
setPrize();

coverEl.addEventListener('click', ()=>{
  coverEl.style.transform = 'translateY(-100%)';
  coverEl.style.opacity = '0';
});

function resetScratch(){
  coverEl.style.transform = 'translateY(0)';
  coverEl.style.opacity = '1';
  prizeEl.innerHTML = '🎁 Loading...';
  setTimeout(setPrize,300);
}
</script>
</body>
</html>
